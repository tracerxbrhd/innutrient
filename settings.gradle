pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'innutrient'

def configuredUApiPath = providers.gradleProperty('u_api_local_path').orNull
def configuredUApiBuild = configuredUApiPath ? file(configuredUApiPath) : null
def localUApiBuild = file('u-api')
def siblingPortBuild = file('../u-api-26.2')
def uApiBuild = configuredUApiBuild != null && configuredUApiBuild.isDirectory() ? configuredUApiBuild
    : (localUApiBuild.isDirectory() ? localUApiBuild
    : (siblingPortBuild.isDirectory() ? siblingPortBuild : null))

if (uApiBuild != null) {
    includeBuild(uApiBuild) {
        dependencySubstitution {
            substitute module('dev.uapi:u-api') using project(':')
        }
    }
} else {
    println 'U-API composite build was not found; resolving dev.uapi:u-api from configured repositories.'
}
